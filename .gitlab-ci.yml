# GitLab CI for the mirror copy (GitHub remains the release platform;
# .github/workflows/* do not run here). Mirrors the GitHub gate: Node 20+22
# for the TypeScript package, Python 3.12 for the reference implementation.
#
# Note: pipelines consume GitLab compute minutes on every push to main, a tag,
# or a merge request. Disable shared runners in Settings > CI/CD if you want
# zero usage.

stages:
  - test

node-tests:
  stage: test
  image: node:$NODE_VERSION
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22"]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm test
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

python-tests:
  stage: test
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - python/pyproject.toml
    paths:
      - .cache/pip/
  script:
    - pip install --quiet -e "python[dev]"
    - pytest python -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
