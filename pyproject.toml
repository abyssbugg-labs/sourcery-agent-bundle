[project]
name = "sourcery-agent-bundle"
version = "0.1.0"
description = "MCP starter bundle for Sourcery security findings and agent remediation workflows"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "mcp[cli]>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sourcery-agent = "sourcery_agent.cli:main"
sourcery-agent-bundle = "sourcery_agent.server:main"
