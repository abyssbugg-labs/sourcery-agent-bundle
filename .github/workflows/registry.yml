name: MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish server.json to the MCP Registry
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the "tag is on main" check below is reliable.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points at main (tag runs only)
        if: github.ref_type == 'tag'
        run: |
          # fetch-depth: 0 above already fetched origin/main; no credentials
          # are persisted, so an extra fetch here would fail.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point at a commit on main. Refusing to publish."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
