name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Guard: only v* tags reach this workflow, and the steps below additionally
    # verify the tag points at a commit on main before anything is published.
    if: startsWith(github.ref, 'refs/tags/v') && github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the "tag is on main" check below is reliable.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag points at main
        run: |
          # fetch-depth: 0 above already fetched origin/main; no credentials
          # are persisted, so an extra fetch here would fail.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point at a commit on main. Refusing to publish."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove private flag for publish
        run: npm pkg delete private

      # npm mints provenance only for public repositories; keep publishing
      # working while the repository is private.
      - name: Publish to npm (with provenance)
        if: github.event.repository.private == false
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (private repository, provenance unavailable)
        if: github.event.repository.private == true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
